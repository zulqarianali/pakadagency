<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Pak Ad Agency</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        // FOUC Prevention
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white min-h-screen transition-colors duration-300">

    <div id="header-placeholder"></div>

    <!-- 1. Hero Section -->
    <section class="py-16 md:py-24 bg-white dark:bg-gray-950 transition-colors duration-300">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <h2 class="text-5xl md:text-6xl font-extrabold text-[#006A4E] dark:text-cyan-400 mb-4 tracking-tight opacity-0" data-animate="slide-in-down">
                Get In Touch
            </h2>
            <p class="text-xl text-gray-600 dark:text-gray-400 opacity-0" data-animate="fade-in-up" style='animation-delay: 0.5s;'>
                We're ready to discuss your next high-impact campaign. Send us a message or find us on the map.
            </p>
        </div>
    </section>

    <!-- 2. Contact Form & Info Section -->
    <section class="py-16 md:py-24 bg-[#f7f9fb] dark:bg-gray-900 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid md:grid-cols-2 gap-12">

            <!-- Contact Form -->
            <div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-xl opacity-0" data-animate="fade-in-up" style='animation-delay: 0s;'>
                <h3 class="text-3xl font-bold mb-6 text-[#006A4E] dark:text-cyan-400">Send Us a Message</h3>
                <form action="#" method="POST" class="space-y-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Full Name</label>
                        <input type="text" id="name" name="name" required class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white shadow-sm focus:border-[#FF9900] focus:ring-[#FF9900] p-3 transition-colors duration-300">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email Address</label>
                        <input type="email" id="email" name="email" required class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white shadow-sm focus:border-[#FF9900] focus:ring-[#FF9900] p-3 transition-colors duration-300">
                    </div>
                    <div>
                        <label for="message" class="block text-sm font-medium text-gray-700 dark:text-gray-300">How Can We Help?</label>
                        <textarea id="message" name="message" rows="4" required class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white shadow-sm focus:border-[#FF9900] focus:ring-[#FF9900] p-3 transition-colors duration-300"></textarea>
                    </div>
                    <button type="submit" class="w-full inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-full text-[#006A4E] dark:text-gray-900 bg-[#FF9900] hover:bg-yellow-500 dark:bg-cyan-400 dark:hover:bg-cyan-300 transition-colors duration-200 shadow-lg">
                        Send Message
                    </button>
                </form>
            </div>

            <!-- Contact Info and Map Placeholder -->
            <div class="space-y-12 opacity-0" data-animate="fade-in-up" style='animation-delay: 0.2s;'>
                <!-- Info Blocks -->
                <div class="space-y-6">
                    <div class="flex items-center space-x-4">
                        <i data-lucide="mail" class="w-6 h-6 text-[#FF9900] dark:text-cyan-400"></i>
                        <div>
                            <p class="font-semibold">Email Us</p>
                            <p class="text-gray-600 dark:text-gray-400">pakadagency1gmail.com</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <i data-lucide="phone" class="w-6 h-6 text-[#FF9900] dark:text-cyan-400"></i>
                        <div>
                            <p class="font-semibold">Call Us</p>
                            <p class="text-gray-600 dark:text-gray-400">+923247107543 </p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <i data-lucide="map-pin" class="w-6 h-6 text-[#FF9900] dark:text-cyan-400"></i>
                        <div>
                            <p class="font-semibold">Our Office</p>
                            <p class="text-gray-600 dark:text-gray-400">Gulberg III, Lahore, Pakistan</p>
                        </div>
                    </div>
                </div>

                <!-- Map Placeholder -->
                <div class="h-64 bg-gray-300 dark:bg-gray-700 rounded-xl shadow-lg flex items-center justify-center transition-colors duration-300">
                    <span class="text-gray-700 dark:text-gray-300 font-medium">Map Placeholder: Lahore Office</span>
                </div>
            </div>

        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="assets/js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Fetch and insert the header
            fetch('header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header-placeholder').innerHTML = data;
                    // Now that the header is loaded, initialize its functionality
                    initializeHeader();
                });

            // Fetch and insert the footer
            fetch('footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer-placeholder').innerHTML = data;
                });
        });
    </script>
</body>
</html>
