<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Pak Ad Agency</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header id="navbar">
        <div class="container">
            <a href="index.html" class="logo">Pak Ad Agency</a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="portfolio.html">Portfolio</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="pricing.html">Pricing</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-header" data-aos="fade-in">
            <div class="container">
                <h1>Our Work</h1>
            </div>
        </section>

        <section id="portfolio-page" data-aos="fade-up">
            <div class="container">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="real">Real</button>
                    <button class="filter-btn" data-filter="ai">AI</button>
                    <button class="filter-btn" data-filter="short">Short</button>
                    <button class="filter-btn" data-filter="branding">Branding</button>
                </div>
                <div class="portfolio-grid">
                    <div class="portfolio-item real">
                        <a href="https://youtube.com/shorts/your_short_id" target="_blank">
                            <img src="assets/images/project1.jpg" alt="Project 1" loading="lazy">
                            <div class="overlay"><h3>Project Title</h3><span>Real</span></div>
                        </a>
                    </div>
                    <div class="portfolio-item ai">
                        <a href="https://youtube.com/shorts/your_short_id" target="_blank">
                            <img src="assets/images/project2.jpg" alt="Project 2" loading="lazy">
                            <div class="overlay"><h3>Project Title</h3><span>AI</span></div>
                        </a>
                    </div>
                    <div class="portfolio-item short">
                       <a href="https://youtube.com/shorts/your_short_id" target="_blank">
                            <img src="assets/images/project3.jpg" alt="Project 3" loading="lazy">
                            <div class="overlay"><h3>Project Title</h3><span>Short</span></div>
                        </a>
                    </div>
                    <div class="portfolio-item branding">
                        <a href="https://youtube.com/shorts/your_short_id" target="_blank">
                            <img src="assets/images/project4.jpg" alt="Project 4" loading="lazy">
                            <div class="overlay"><h3>Project Title</h3><span>Branding</span></div>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Pak Ad Agency. Powered by Urdu Ai Official.</p>
        </div>
    </footer>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>
    <script src="assets/js/script.js"></script>
</body>
</html>
